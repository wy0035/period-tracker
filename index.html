<body>
<div class="app">
  <header class="app-header">
    <div class="brand">
      <div class="brand-logo">🌸</div>
      <div class="brand-text">
        <h1>经期工作台</h1>
        <p>记录周期 · 追踪规律 · 关爱自己</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" id="btnSample">加载示例</button>
      <button class="btn btn-primary" id="btnAdd">＋ 记录经期</button>
    </div>
  </header>
  <section class="overview">
    <div class="stat-card accent">
      <div class="label">下次经期预测</div>
      <div class="value" id="statNext">—<span class="unit"></span></div>
      <div class="sub" id="statNextSub">暂无足够数据</div>
    </div>
    <div class="stat-card">
      <div class="label">平均周期长度</div>
      <div class="value" id="statCycle">—<span class="unit">天</span></div>
      <div class="sub" id="statCycleSub">基于历史记录</div>
    </div>
    <div class="stat-card">
      <div class="label">平均经期天数</div>
      <div class="value" id="statPeriod">—<span class="unit">天</span></div>
      <div class="sub" id="statPeriodSub">每次持续天数</div>
    </div>
    <div class="stat-card ok">
      <div class="label">距离下次经期</div>
      <div class="value" id="statCountdown">—<span class="unit">天</span></div>
      <div class="sub" id="statCountdownSub">—</div>
    </div>
  </section>
  <section class="layout">
    <div class="card" id="formCard">
      <div class="card-title">
        <h2><span class="icon">✍️</span> 记录经期</h2>
        <span class="meta" id="formMode">新增记录</span>
      </div>
      <form id="periodForm">
        <input type="hidden" id="recordId">
        <div class="form-row">
          <div class="form-group">
            <label for="startDate">开始日期</label>
            <input type="date" id="startDate" required>
          </div>
          <div class="form-group">
            <label for="endDate">结束日期</label>
            <input type="date" id="endDate">
          </div>
        </div>
        <div class="form-group full" style="margin-bottom:14px;">
          <label>经血量</label>
          <div class="flow-options" id="flowOptions">
            <div class="flow-chip" data-flow="light">量少</div>
            <div class="flow-chip" data-flow="normal">正常</div>
            <div class="flow-chip" data-flow="heavy">量多</div>
          </div>
        </div>
        <div class="form-group full" style="margin-bottom:14px;">
          <label>伴随症状（可多选）</label>
          <div class="symptom-tags" id="symptomTags">
            <span class="symptom-tag" data-symptom="痛经">痛经</span>
            <span class="symptom-tag" data-symptom="腰酸">腰酸</span>
            <span class="symptom-tag" data-symptom="头痛">头痛</span>
            <span class="symptom-tag" data-symptom="乳房胀痛">乳房胀痛</span>
            <span class="symptom-tag" data-symptom="情绪波动">情绪波动</span>
            <span class="symptom-tag" data-symptom="疲劳">疲劳</span>
            <span class="symptom-tag" data-symptom="痤疮">痤疮</span>
            <span class="symptom-tag" data-symptom="失眠">失眠</span>
            <span class="symptom-tag" data-symptom="食欲变化">食欲变化</span>
          </div>
        </div>
        <div class="form-group full">
          <label for="notes">备注</label>
          <textarea id="notes" placeholder="记录情绪、特殊事件或其他想备注的内容..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="btnCancel">取消</button>
          <button type="submit" class="btn btn-primary">保存记录</button>
        </div>
      </form>
    </div>
    <div class="card">
      <div class="card-title">
        <h2><span class="icon">📋</span> 历史记录</h2>
        <span class="meta" id="historyCount">0 条记录</span>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-state">
          <div class="emoji">🌷</div>
          <p>还没有记录<br>点击「记录经期」开始</p>
        </div>
      </div>
    </div>
  </section>
  <section class="layout full">
    <div class="card">
      <div class="card-title">
        <h2><span class="icon">📅</span> 经期日历</h2>
        <div class="calendar-legend">
          <span><span class="legend-dot" style="background:linear-gradient(135deg,var(--accent),var(--accent2));"></span>经期</span>
          <span><span class="legend-dot" style="background:#fff4e6;border:1px solid #ffd8a8;"></span>易孕期</span>
          <span><span class="legend-dot" style="background:#fff0f6;border:1px dashed var(--accent);"></span>排卵日</span>
          <span><span class="legend-dot" style="background:repeating-linear-gradient(45deg,var(--accent-soft),var(--accent-soft) 3px,#fff 3px,#fff 6px);"></span>预测经期</span>
        </div>
      </div>
      <div class="calendar-header">
        <div class="calendar-nav">
          <button id="calPrev">‹</button>
          <span class="month-label" id="calMonthLabel">—</span>
          <button id="calNext">›</button>
        </div>
        <button class="btn btn-ghost btn-sm" id="calToday">回到今天</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </section>
  <section class="layout">
    <div class="card">
      <div class="card-title">
        <h2><span class="icon">📈</span> 周期趋势</h2>
        <span class="meta">周期长度 vs 经期天数</span>
      </div>
      <figure class="chart-figure">
        <div class="chart-container" id="chartTrend"></div>
      </figure>
    </div>
    <div class="card">
      <div class="card-title">
        <h2><span class="icon">⏱️</span> 周期时间线</h2>
        <span class="meta">最近 6 个周期</span>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>
  <section class="layout full">
    <div class="card">
      <div class="card-title">
        <h2><span class="icon">🌡️</span> 症状统计</h2>
        <span class="meta">各症状出现频次</span>
      </div>
      <figure class="chart-figure">
        <div class="chart-container" id="chartSymptoms" style="min-height:280px;"></div>
      </figure>
    </div>
  </section>
  <section class="layout full">
    <div class="card">
      <div class="card-title">
        <h2><span class="icon">💾</span> 数据管理</h2>
        <span class="meta">数据保存在本地浏览器</span>
      </div>
      <div class="data-actions">
        <button class="btn btn-ghost" id="btnExport">导出 JSON</button>
        <button class="btn btn-ghost" id="btnImport">导入 JSON</button>
        <button class="btn btn-danger" id="btnClear">清空所有数据</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none;">
    </div>
  </section>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">记录经期</h2>
